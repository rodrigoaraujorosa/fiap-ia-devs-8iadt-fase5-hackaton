[project]
name = "sdr-api"
version = "0.1.0"
description = "API do Agente SDR Imobiliário (FastAPI + LangGraph)"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "anthropic>=1.8.0",
    "apscheduler>=3.11.3",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "fastembed>=0.8.1",
    "langfuse>=4.15.6",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-postgres>=3.1.2",
    "pgvector>=0.5.0",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # Depends() em default de argumento é o padrão do FastAPI

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning"]
