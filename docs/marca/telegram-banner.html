<!doctype html>
<!-- Banner da descrição do bot no Telegram (640x360, 16:9). Gerado em 1280x720:
     chrome --headless=new --window-size=1280,720 --screenshot=telegram-banner-1280x720.png telegram-banner.html -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@500;700;900&family=Open+Sans:wght@600&display=swap">
<style>
  html, body { margin: 0; }
  .banner {
    position: relative; width: 1280px; height: 720px; overflow: hidden; color: #fff;
    background: radial-gradient(90% 90% at 78% 30%, #2c3352 0%, #1e2237 45%, #161c2f 100%);
    font-family: "Red Hat Display", sans-serif;
  }
  .skyline { position: absolute; left: 0; right: 0; bottom: 0; height: 250px; opacity: .12; }
  .glow { position: absolute; width: 620px; height: 620px; right: 40px; top: 30px; border-radius: 50%;
    background: radial-gradient(circle, rgba(20, 184, 166, .42) 0%, rgba(20, 184, 166, 0) 65%); }
  .robot { position: absolute; right: 110px; top: 70px; width: 500px; height: 500px; border-radius: 50%;
    box-shadow: 0 30px 80px rgba(0, 0, 0, .45); }
  .text { position: absolute; left: 96px; top: 130px; width: 600px; }
  .eyebrow { margin: 0 0 18px; font-size: 22px; font-weight: 700; letter-spacing: .3em; text-transform: uppercase; color: #c9a45c; }
  h1 { margin: 0; font-size: 104px; font-weight: 900; line-height: 1; letter-spacing: -.01em; }
  .sub { margin: 18px 0 38px; font-size: 34px; font-weight: 500; color: #c5cad6; line-height: 1.3; }
  .chips { display: flex; flex-wrap: nowrap; gap: 10px; }
  .chip { font-family: "Open Sans", sans-serif; font-weight: 600; font-size: 19px; padding: 8px 16px; white-space: nowrap; border-radius: 999px;
    border: 2px solid rgba(94, 234, 212, .55); color: #ccfbf1; background: rgba(20, 184, 166, .12); }
  .foot { position: absolute; left: 96px; bottom: 40px; font-family: "Open Sans", sans-serif; font-size: 20px; color: #8b93a7; }
  .foot b { color: #5eead4; }
</style>
</head>
<body>
<div class="banner">
  <svg class="skyline" viewBox="0 0 1200 220" preserveAspectRatio="none" aria-hidden="true">
    <path fill="#c5cad6" d="M0 220V150h40v-30h30v50h25V90h45v130h20V60h50v160h15v-90h35v90h20V30h55v190h20V110h40v110h25V70h35v150h20V120h45v100h15V40h60v180h20V100h30v120h20V80h45v140h25V130h40v90h20V50h50v170h20V110h35v110h20V70h40v150h25V140h40v80h20V90h45v130z"/>
  </svg>
  <div class="glow"></div>
  <img class="robot" src="../../web/public/laris-avatar.svg" alt="">
  <div class="text">
    <p class="eyebrow">Imobiliária Exemplo</p>
    <h1>Oi, eu sou<br>a Laris!</h1>
    <p class="sub">Imóveis corporativos em SP,<br>24 horas por dia.</p>
    <div class="chips">
      <span class="chip">Conjuntos</span><span class="chip">Andares</span>
      <span class="chip">Galpões</span><span class="chip">Investimentos</span>
    </div>
  </div>
  <p class="foot">Assistente virtual · tecnologia <b>ImobiQ</b></p>
</div>
</body>
</html>
